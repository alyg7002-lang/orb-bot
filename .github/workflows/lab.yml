name: Strategy lab (backtests)

# Research runs only: downloads history with the Alpaca keys, runs a backtest script and commits its
# results file. Never trades. Separate concurrency group, so it never blocks the bot's runs.
# Start it by pushing .github/run-lab (first word = which lab), or Actions -> Strategy lab -> Run workflow.
on:
  push:
    paths: [".github/run-lab"]
  workflow_dispatch:
    inputs:
      lab:
        description: "Which lab"
        required: true
        default: "pdhl"
        type: choice
        options: [pdhl]

permissions:
  contents: write

concurrency:
  group: orb-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache downloaded bars
        uses: actions/cache@v4
        with:
          path: data/cache
          key: bars-${{ hashFiles('.github/run-lab') }}
          restore-keys: bars-
      - name: Which lab
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "lab=${{ inputs.lab }}" >> "$GITHUB_OUTPUT";
          else echo "lab=$(awk '{print $1; exit}' .github/run-lab)" >> "$GITHUB_OUTPUT"; fi
      - name: Prior-day high/low lab
        if: steps.which.outputs.lab == 'pdhl'
        run: python scripts/pdhl_lab.py
      - name: Save results
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          git add data/pdhl_lab.txt data/pdhl_lab.json || true
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Lab results: ${{ steps.which.outputs.lab }} $(date '+%Y-%m-%d %H:%M ET')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
